<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式会社 里中電気 新社屋（plan6）｜3Dパース</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bcd8ee;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .ui{position:fixed;z-index:10;user-select:none;}
  #title{top:22px;left:26px;color:#2b3440;transition:color .8s;}
  body.night #title{color:#e8f0f8;}
  #title h1{margin:0;font-size:21px;letter-spacing:.1em;font-weight:700;}
  #title p{margin:4px 0 0;font-size:11px;letter-spacing:.18em;opacity:.75;}
  #hint{bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.15em;color:#4a5a6a;background:rgba(255,255,255,.55);padding:6px 14px;border-radius:14px;backdrop-filter:blur(4px);}
  .btn-group{display:flex;border-radius:22px;overflow:hidden;box-shadow:0 4px 14px rgba(20,40,60,.25);}
  .btn-group button{border:0;padding:10px 16px;font-size:13px;letter-spacing:.06em;cursor:pointer;font-family:inherit;background:#fff;color:#5a6a7a;transition:background .3s,color .3s;}
  .btn-group button.active{background:#2b3f55;color:#fff;}
  #daynight{bottom:22px;right:26px;}
  #roofui{bottom:22px;right:170px;}
  #modeui{bottom:22px;right:352px;}
  @media (max-width:900px){
    #modeui{bottom:70px;right:26px;}
    #roofui{right:150px;}
    #title h1{font-size:15px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="ui" id="title">
  <h1>株式会社 里中電気　新社屋</h1>
  <p>SATONAKA DENKI NEW OFFICE ｜ plan6 平面図より作成・3Dパース（色は仮）</p>
</div>
<div class="ui" id="hint">ドラッグで回転 ／ ホイールでズーム ／ 2Fの大型スクリーンで動画再生中</div>
<div class="ui btn-group" id="modeui">
  <button id="btn-whole" class="active">外観</button>
  <button id="btn-explode">フロア分解</button>
</div>
<div class="ui btn-group" id="roofui">
  <button id="btn-roofoff" class="active">屋根なし</button>
  <button id="btn-roofon">屋根あり</button>
</div>
<div class="ui btn-group" id="daynight">
  <button id="btn-day" class="active">☀ 昼</button>
  <button id="btn-night">🌙 夜</button>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import {OrbitControls} from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

/* ============ 基本セットアップ ============ */
const app=document.getElementById('app');
const scene=new THREE.Scene();
const SKY_D=new THREE.Color(0xbcd8ee), SKY_N=new THREE.Color(0x0d1524);
scene.background=SKY_D.clone();
scene.fog=new THREE.Fog(SKY_D.clone(),90,320);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.3,900);
camera.position.set(23,11,17);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
app.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,3.4,0);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.autoRotate=true;
controls.autoRotateSpeed=.5;
controls.minDistance=7;
controls.maxDistance=80;
controls.maxPolarAngle=Math.PI/2-.04;
let idleTimer=null;
controls.addEventListener('start',()=>{controls.autoRotate=false;clearTimeout(idleTimer);});
controls.addEventListener('end',()=>{clearTimeout(idleTimer);idleTimer=setTimeout(()=>controls.autoRotate=true,7000);});

const hemi=new THREE.HemisphereLight(0xdcebff,0x9aa08e,.95);scene.add(hemi);
const amb=new THREE.AmbientLight(0xdfe8f0,.34);scene.add(amb);
const sun=new THREE.DirectionalLight(0xfff2da,1.5);
sun.position.set(25,32,18);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.far=130;
sun.shadow.camera.left=-35;sun.shadow.camera.right=35;
sun.shadow.camera.top=45;sun.shadow.camera.bottom=-30;
sun.shadow.bias=-4e-4;
scene.add(sun);

/* ============ ヘルパー ============ */
const M=o=>new THREE.MeshStandardMaterial(o);
function mesh(geo,mat,x=0,y=0,z=0,parent=scene){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
  m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
function tex(c){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}

/* 図面座標系(平面図: x=右, z=下=南) → モデル座標 */
const OX=-5.0, OZ=-5.5;
const P=(px,pz)=>[px+OX,pz+OZ];
/* 斜め壁: E(0,4.55)→D(7.28,10.92) 方向ベクトル */
const DIAG_ANG=-Math.atan2(6.37,7.28);           // 回転角
const DU={x:7.28/9.673,z:6.37/9.673};            // 斜め方向 単位ベクトル
const DN={x:6.37/9.673,z:-7.28/9.673};           // 内側(北東)法線
const DP=(t,d)=>P(0+DU.x*t+DN.x*d, 4.55+DU.z*t+DN.z*d); // 斜め座標→モデル

/* ============ フロア分解用トレイ ============ */
const t1=new THREE.Group();scene.add(t1);        // 1F(躯体1F+内装)
const t2=new THREE.Group();scene.add(t2);        // 2F(スラブ+内装+パラペット)
const tR=new THREE.Group();scene.add(tR);        // 屋根

/* ============ マテリアル（仮色） ============ */
const wallOut =M({color:0xeef0ea,roughness:.85});
const wallIn  =M({color:0xf5f4ef,roughness:.9});
const navy    =M({color:0x2b3a55,roughness:.6});
const bandMat =M({color:0x3a4048,roughness:.6,metalness:.2});
const glassMat=M({color:0x84b8d2,roughness:.08,metalness:.25,transparent:true,opacity:.55,side:THREE.DoubleSide});
const frameMat=M({color:0xd9dbd7,roughness:.6});
const floorWork=M({color:0xc9cdd0,roughness:.95});
const floorEnt=M({color:0xd8d2c2,roughness:.85});
const floorOfc=M({color:0xa8b4bd,roughness:.95,side:THREE.DoubleSide});
const deckMat =M({color:0xb9a98c,roughness:.9});
const woodMat =M({color:0xc09a6a,roughness:.8});
const darkMat =M({color:0x3a4048,roughness:.7});
const counterMat=M({color:0xe8e2d5,roughness:.7});
const trunkMat=M({color:0x8a5a38,roughness:.95});
const leafMats=[M({color:0x58a84e,roughness:.9,flatShading:true}),M({color:0x6cbf58,roughness:.9,flatShading:true}),M({color:0x4c9a45,roughness:.9,flatShading:true})];
const skinMat=M({color:0xe8bc98,roughness:.8});
const shirtCols=[0x4a7fb5,0xc25545,0xe8b13f,0x5f9e6e,0x8468a8,0x3a4048,0xd8dfe6];
const pantsMat=M({color:0x39414c,roughness:.85});
const inLights=[];

/* ============ ロゴ（添付ロゴ再現: Xマーク+社名） ============ */
function drawMark(x,cx,cy,s){
  x.fillStyle=x.strokeStyle='#15181c';
  x.lineCap='butt';
  const w=s*.17;
  x.lineWidth=w;
  x.beginPath();x.moveTo(cx+s*.12,cy+s*.10);x.lineTo(cx+s*.88,cy+s*.90);x.stroke();
  x.beginPath();x.moveTo(cx+s*.88,cy+s*.10);x.lineTo(cx+s*.12,cy+s*.90);x.stroke();
  x.lineWidth=s*.07;
  x.beginPath();
  x.moveTo(cx+s*.05,cy+s*.56);
  x.lineTo(cx+s*.05,cy+s*.93);
  x.lineTo(cx+s*.44,cy+s*.93);
  x.closePath();x.stroke();
}
function logoTexH(){ // 横長: マーク+株式会社/里中電気
  const c=document.createElement('canvas');c.width=1024;c.height=300;
  const x=c.getContext('2d');
  x.fillStyle='#f8f8f6';x.fillRect(0,0,1024,300);
  drawMark(x,30,25,250);
  x.fillStyle='#15181c';x.textAlign='left';
  x.font='500 58px "Yu Gothic",sans-serif';
  x.fillText('株式会社',330,95);
  x.font='700 132px "Yu Gothic",sans-serif';
  x.fillText('里中電気',325,235);
  return tex(c);
}
function logoTexV(){ // 縦長(ポールサイン)
  const c=document.createElement('canvas');c.width=256;c.height=1024;
  const x=c.getContext('2d');
  x.fillStyle='#f8f8f6';x.fillRect(0,0,256,1024);
  drawMark(x,33,20,190);
  x.fillStyle='#15181c';x.textAlign='center';
  x.font='700 148px "Yu Gothic",sans-serif';
  '里中電気'.split('').forEach((ch,i)=>x.fillText(ch,128,360+i*168));
  return tex(c);
}
const logoMatH=M({map:logoTexH(),roughness:.7});

/* ============ 地面・道路・駐車場 ============ */
const ground=mesh(new THREE.PlaneGeometry(600,600),M({color:0xb7bcb5,roughness:1}),0,0,0);
ground.rotation.x=-Math.PI/2;ground.castShadow=false;
function flat(w,d,x,z,mat,y=.03,parent=scene){
  const p=mesh(new THREE.PlaneGeometry(w,d),mat,x,y,z,parent);
  p.rotation.x=-Math.PI/2;p.castShadow=false;return p;
}
const asphalt=M({color:0x8b8f94,roughness:.95});
const roadMat=M({color:0x54585e,roughness:.95});
flat(26,22,6,-1,asphalt,.02);
flat(300,7,0,-13.5,roadMat);
flat(7,300,21.5,0,roadMat);
const lineMat=M({color:0xe8ecef,roughness:.9});
for(let i=0;i<14;i++){flat(3,.25,-90+i*14,-13.5,lineMat,.05);}
for(let i=0;i<14;i++){flat(.25,3,21.5,-90+i*14,lineMat,.05);}
for(let i=0;i<5;i++)flat(.15,5.4,8.4+i*2.6,2.2,lineMat,.05);
for(let i=0;i<4;i++)flat(2.45,.15,9.7+i*2.6,-.45,lineMat,.05);

/* ============ 躯体パラメータ ============ */
const FT=.4, H1=4.0, SL=.35, F2=FT+H1, H2=2.9, TOP=F2+H2, PAR=.7;
/* 平面: 北西に910の切欠きあり */
const FP=[[0,.91],[3.64,.91],[3.64,0],[10.01,0],[10.01,10.92],[7.28,10.92],[0,4.55]];
function footShape(inset=0){
  const cx=5.2,cz=4.9;
  const s=new THREE.Shape();
  FP.forEach((p,i)=>{
    let px=p[0],pz=p[1];
    if(inset){const dx=cx-px,dz=cz-pz,L=Math.hypot(dx,dz);px+=dx/L*inset;pz+=dz/L*inset;}
    const [mx,mz]=P(px,pz);
    i?s.lineTo(mx,mz):s.moveTo(mx,mz);
  });
  s.closePath();return s;
}
const STAIR_HOLE=[5.5,.5,7.25,2.55]; // 2F吹抜け(階段室 上部)
function holed(s){
  const h=new THREE.Path();
  const[a,b,c,d]=STAIR_HOLE;
  h.moveTo(a+OX,b+OZ);h.lineTo(c+OX,b+OZ);h.lineTo(c+OX,d+OZ);h.lineTo(a+OX,d+OZ);h.closePath();
  s.holes.push(h);return s;
}
function slabGeo(shape,y,thk){
  const g=new THREE.ExtrudeGeometry(shape,{depth:thk,bevelEnabled:false});
  g.rotateX(Math.PI/2);g.translate(0,y+thk,0);return g;
}
/* 1F土間 */
{
  const m=new THREE.Mesh(slabGeo(footShape(),0,FT),M({color:0xb0b2ae,roughness:.95}));
  m.castShadow=m.receiveShadow=true;t1.add(m);
}
/* 2Fスラブ(階段開口) */
{
  const m=new THREE.Mesh(slabGeo(holed(footShape()),F2-SL,SL),bandMat);
  m.castShadow=m.receiveShadow=true;t2.add(m);
}
/* 1F天井(2Fスラブ下面) */
{
  const g=new THREE.ShapeGeometry(holed(footShape(.15)));
  g.rotateX(Math.PI/2);g.translate(0,F2-SL-.01,0);
  const m=new THREE.Mesh(g,M({color:0xf4f3ee,roughness:.9,side:THREE.DoubleSide}));
  m.receiveShadow=true;t2.add(m);
}
/* 2F床仕上げ */
{
  const g=new THREE.ShapeGeometry(holed(footShape(.18)));
  g.rotateX(Math.PI/2);g.translate(0,F2+.01,0);
  const m=new THREE.Mesh(g,floorOfc);m.receiveShadow=true;t2.add(m);
}

/* 壁ヘルパー(図面座標・任意方向) */
function wall(px0,pz0,px1,pz1,y0,h,mat=wallIn,thk=.16,parent=t1){
  const [x0,z0]=P(px0,pz0),[x1,z1]=P(px1,pz1);
  const len=Math.hypot(x1-x0,z1-z0);
  const m=mesh(B(len,h,thk),mat,(x0+x1)/2,y0+h/2,(z0+z1)/2,parent);
  m.rotation.y=-Math.atan2(z1-z0,x1-x0);
  return m;
}
function winPane(px,pz,y,w,h,ry=0,parent=t1,hood=0){
  const [x,z]=P(px,pz);
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;parent.add(g);
  mesh(B(w,h,.26),frameMat,0,0,0,g).castShadow=false;
  const gl=mesh(B(w-.12,h-.12,.24),glassMat,0,0,0,g);gl.castShadow=false;
  mesh(B(.05,h-.12,.27),bandMat,0,0,0,g).castShadow=false;
  if(hood)mesh(B(w+.18,.14,.28),frameMat,0,h/2+.1,hood*.2,g); // 水切り庇
  return g;
}

/* ============ 外壁(斜め面は開放カットアウェイ) ============ */
const EXT1=[[0,.91,3.64,.91],[3.64,.91,3.64,0],[3.64,0,10.01,0],[10.01,0,10.01,10.92],[7.28,10.92,10.01,10.92],[0,.91,0,4.55]];
EXT1.forEach(s=>wall(s[0],s[1],s[2],s[3],FT,H1,wallOut,.2,t1));
/* 2F: バルコニーも立面図どおり壁で囲う(東面に窓開口) */
const EXT2=[[0,.91,3.64,.91],[3.64,.91,3.64,0],[3.64,0,10.01,0],[10.01,0,10.01,10.92],[7.28,10.92,10.01,10.92],[0,.91,0,4.55]];
EXT2.forEach(s=>wall(s[0],s[1],s[2],s[3],F2,H2+PAR,wallOut,.2,t2));
/* 幅木(外周ベース・濃色) */
EXT1.forEach(s=>wall(s[0],s[1],s[2],s[3],FT,.24,bandMat,.26,t1));
/* 斜め面の見切り・柱 */
{
  const [dx0,dz0]=P(0,4.55),[dx1,dz1]=P(7.28,10.92);
  const len=Math.hypot(dx1-dx0,dz1-dz0);
  const mk=(y,h,parent)=>{
    const b=mesh(B(len,h,.22),bandMat,(dx0+dx1)/2,y,(dz0+dz1)/2,parent);
    b.rotation.y=DIAG_ANG;return b;
  };
  mk(FT/2,FT,t1);
  mk(F2-SL/2,SL+.1,t2);
  mk(TOP+PAR/2,PAR,t2);
  for(let i=1;i<4;i++){
    const t=i/4;
    mesh(B(.24,H1,.24),M({color:0xdcddd6,roughness:.8}),dx0+(dx1-dx0)*t,FT+H1/2,dz0+(dz1-dz0)*t,t1);
    mesh(B(.24,H2,.24),M({color:0xdcddd6,roughness:.8}),dx0+(dx1-dx0)*t,F2+H2/2,dz0+(dz1-dz0)*t,t2);
  }
}
/* ===== 窓(立面図準拠) ===== */
/* 手前(z=0/0.91)面: 引違い窓 上下2組(水切り庇付き) */
winPane(2.3,.91,FT+1.4,1.2,1.4,0,t1,-1);            // 1F トイレ・洗面側
winPane(4.9,0,FT+1.4,1.2,1.4,0,t1,-1);              // 1F 階段室
winPane(2.3,.91,F2+.95,1.2,1.2,0,t2,-1);            // 2F 給湯室
winPane(4.9,0,F2+.95,1.2,1.2,0,t2,-1);              // 2F トイレ
/* 西面: 勝手口ドア + 面格子窓 + 横スリット(立面図準拠) */
{
  const WWX=P(0,0)[0]-.11;
  const dz=P(0,2.6)[1];
  const dg=new THREE.Group();dg.position.set(WWX,0,dz);dg.rotation.y=-Math.PI/2;t1.add(dg);
  mesh(B(1.0,2.15,.06),bandMat,0,FT+1.1,0,dg).castShadow=false;       // 勝手口枠
  mesh(B(.86,2.05,.08),M({color:0xcfd4d8,roughness:.5,metalness:.3}),0,FT+1.1,.03,dg);
  const dgl=mesh(B(.6,.9,.1),glassMat,0,FT+1.55,.03,dg);dgl.castShadow=false;
  /* 面格子窓 */
  const lg=new THREE.Group();lg.position.set(WWX,FT+1.55,P(0,3.75)[1]);lg.rotation.y=-Math.PI/2;t1.add(lg);
  mesh(B(.8,.95,.08),frameMat,0,0,.02,lg).castShadow=false;
  const lgl=mesh(B(.68,.83,.1),glassMat,0,0,.02,lg);lgl.castShadow=false;
  for(let i=0;i<5;i++)mesh(B(.05,.95,.04),bandMat,-.32+i*.16,0,-.06,lg).castShadow=false;
  for(let i=0;i<3;i++)mesh(B(.8,.05,.04),bandMat,0,-.3+i*.3,-.07,lg).castShadow=false;
  /* 横スリット(勝手口上) */
  winPane(0,2.75,FT+2.9,1.3,.5,Math.PI/2,t1,-1);
}
/* ===== 東面ファサード(正面): 倉庫大開口・縦格子エントランス ===== */
const EWX=P(10.01,0)[0]+.11;            // 東壁 外面x
/* 倉庫: 4枚建てガラス大開口 + 欄間(立面図準拠) */
{
  const [x,z]=P(10.01,2.3);
  const g=new THREE.Group();g.position.set(EWX,0,z);g.rotation.y=Math.PI/2;t1.add(g);
  mesh(B(3.3,3.0,.1),bandMat,0,FT+1.6,0,g).castShadow=false;          // 外枠
  const gl=mesh(B(3.14,2.5,.12),glassMat,0,FT+1.35,0,g);gl.castShadow=false;
  for(let i=1;i<4;i++)mesh(B(.06,2.5,.14),bandMat,-1.57+i*.785,FT+1.35,0,g).castShadow=false;
  mesh(B(3.14,.06,.14),bandMat,0,FT+2.62,0,g).castShadow=false;
  const rm=mesh(B(3.14,.6,.12),glassMat,0,FT+2.96,0,g);rm.castShadow=false; // 欄間(2枚)
  mesh(B(.06,.6,.14),bandMat,0,FT+2.96,0,g).castShadow=false;
  /* 土間前のスロープ */
  const sl=mesh(B(.9,.08,3.4),M({color:0xb9bdc1,roughness:.9}),EWX+.5,.2,z,t1);
  sl.rotation.z=-.16;sl.castShadow=false;
}
/* (東1Fの窓は大開口とドア・スリットのみ=立面図準拠) */
/* 東2F: 横連窓(4分割・水切り付き)+正方形窓+バルコニー窓(立面図準拠) */
{
  const [x,z]=P(10.01,2.35);
  const g=new THREE.Group();g.position.set(P(10.01,0)[0],F2+1.0,z);g.rotation.y=Math.PI/2;t2.add(g);
  mesh(B(3.4,1.05,.1),frameMat,0,0,0,g).castShadow=false;
  const gl=mesh(B(3.28,.93,.12),glassMat,0,0,0,g);gl.castShadow=false;
  for(let i=1;i<4;i++)mesh(B(.05,.93,.13),bandMat,-1.7+i*.85,0,0,g).castShadow=false;
  mesh(B(3.58,.14,.28),frameMat,0,.62,.12,g);        // 水切り
}
winPane(10.01,5.85,F2+1.0,1.1,1.1,Math.PI/2,t2,1);   // 2F 正方形窓
winPane(10.01,9.1,F2+1.15,1.6,1.1,Math.PI/2,t2,1);   // バルコニー窓
/* ===== エントランス(東・木縦格子スクリーン+木格子ドア+庇) ===== */
{
  const woodSlat=M({color:0x9a6b40,roughness:.75});
  const slat=(pz)=>{
    const s=mesh(B(.07,H1-.15,.09),woodSlat,EWX+.10,FT+(H1-.15)/2,P(10.01,pz)[1],t1);
    s.castShadow=false;return s;
  };
  /* 格子帯(窓・ドアを避けて3帯) */
  [[5.95,6.38],[7.68,8.14],[10.05,10.6]].forEach(([a,b])=>{
    for(let pz=a;pz<=b+.01;pz+=.16)slat(pz);
  });
  /* 木格子ドア(立面図: 縦板+筋交い) z6.5-7.5 */
  const dz=P(10.01,7.0)[1];

/* ============ トグル(昼夜・屋根・分解) ============ */
let nightT=0,nightTarget=0,exT=0,exTarget=0;
const G=4.6;
const btnD=document.getElementById('btn-day');
const btnN=document.getElementById('btn-night');
const btnRoofOff=document.getElementById('btn-roofoff');
const btnRoofOn=document.getElementById('btn-roofon');
const btnWh=document.getElementById('btn-whole');
const btnEx=document.getElementById('btn-explode');

btnN.addEventListener('click',()=>{nightTarget=1;btnN.classList.add('active');btnD.classList.remove('active');document.body.classList.add('night');tryPlay();});
btnRoofOff.addEventListener('click',()=>{tR.visible=false;btnRoofOff.classList.add('active');btnRoofOn.classList.remove('active');tryPlay();});
btnRoofOn.addEventListener('click',()=>{tR.visible=true;btnRoofOn.classList.add('active');btnRoofOff.classList.remove('active');tryPlay();});
let camFrom=null,camTo=null;
function setMode(t){
  exTarget=t;
  camFrom=camera.position.clone();
  const dir=camera.position.clone().sub(new THREE.Vector3(controls.target.x,0,controls.target.z));
  dir.y=0;
  if(dir.lengthSq()<1e-4)dir.set(-.6,0,.8);
  dir.normalize();
  const d=t?30:24, h=t?17:13;
  camTo=new THREE.Vector3(controls.target.x+dir.x*d,h,controls.target.z+dir.z*d);
  tryPlay();
}
btnWh.addEventListener('click',()=>{setMode(0);btnWh.classList.add('active');btnEx.classList.remove('active');});
btnEx.addEventListener('click',()=>{setMode(1);btnEx.classList.add('active');btnWh.classList.remove('active');});

const SUN_D=new THREE.Color(0xfff2da), SUN_N=new THREE.Color(0x8fa8d8);
function applyNight(t){
  scene.background.copy(SKY_D).lerp(SKY_N,t);
  scene.fog.color.copy(scene.background);
  sun.intensity=1.5-1.38*t;
  sun.color.copy(SUN_D).lerp(SUN_N,t);
  hemi.intensity=.95-.8*t;
  amb.intensity=.34-.26*t;
  inLights.forEach(p=>p.intensity=22+38*t);
  lampBulbs.forEach(({b,pl})=>{
    b.material.emissiveIntensity=.2+1.3*t;
    pl.intensity=t*26;
  });
  starMat.opacity=t;stars.visible=t>.05;
  moon.material.opacity=t;moon.visible=t>.05;
  cloudMat.opacity=.85-.6*t;
}
function applyExplode(t){
  t2.position.y=t*G;
  tR.position.y=t*G*2;
  lb1.material.opacity=t;lb2.material.opacity=t;
  controls.target.y=3.4+t*2.6;
}

/* ============ ループ ============ */
const clk=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clk.getDelta(),.05);
  if(Math.abs(nightT-nightTarget)>1e-3){nightT+=(nightTarget-nightT)*Math.min(1,dt*2.2);applyNight(nightT);}
  if(Math.abs(exT-exTarget)>1e-3){
    exT+=(exTarget-exT)*Math.min(1,dt*2.2);
    applyExplode(exT);
    if(camFrom&&camTo){
      const p=exTarget===1?exT:1-exT;
      camera.position.lerpVectors(camFrom,camTo,p);
    }
  }
  clouds.forEach((c,i)=>{c.position.x+=dt*(.3+i*.1);if(c.position.x>110)c.position.x=-110;});
  movVan.position.z-=dt*7;if(movVan.position.z<-90)movVan.position.z=90;
  controls.update();
  renderer.render(scene,camera);
}
applyNight(0);applyExplode(0);
loop();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
